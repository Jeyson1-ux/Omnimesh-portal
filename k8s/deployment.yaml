apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnimesh-portal
  labels:
    app: omnimesh-portal
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: omnimesh-portal
  template:
    metadata:
      labels:
        app: omnimesh-portal
    spec:
      containers:
      - name: portal
        image: omnimesh-portal:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        resources: 
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"